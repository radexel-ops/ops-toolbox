# ============================================================
# AI Debate System - Configuration File
# ============================================================
# 이 파일에서 토론 시스템의 모든 설정을 커스터마이징할 수 있습니다.
# 수정 후 스크립트를 다시 실행하면 변경 사항이 적용됩니다.
# ============================================================

# ------------------------------------------------------------
# 시스템 설정 (System Settings)
# ------------------------------------------------------------
system:
  # 최대 토론 턴 수 (한 턴 = 한 AI의 발언 1회)
  # 0으로 설정하면 무한 토론 (합의될 때까지)
  # 일반적으로 4-10턴 내에 합의가 도출됩니다
  max_turns: 15

  # 합의 토큰 - AI들이 합의했을 때 출력하는 특수 문자열
  # 양쪽 모두 이 토큰을 출력해야 토론이 종료됩니다
  consensus_token: "[AGREED]"

  # 히스토리 저장 디렉토리
  history_dir: "./history"

  # 터미널 출력 모드
  # verbose: 토론 과정 전체 표시
  # minimal: 최종 결과만 표시
  output_mode: "verbose"

  # 각 AI 응답 사이의 대기 시간 (초) - API Rate Limit 방지
  delay_between_turns: 1

# ------------------------------------------------------------
# 모델 설정 (Model Configuration)
# ------------------------------------------------------------
models:
  # Google Gemini 모델 옵션
  google:
    "Gemini 3 Flash": "gemini-3-flash-preview"
    "Gemini 3 Pro": "gemini-3-pro-preview"
    "Gemini 2.0 Flash": "gemini-2.0-flash"
    "Gemini 1.5 Pro": "gemini-1.5-pro"
    "Gemini 1.5 Flash": "gemini-1.5-flash"

  # OpenAI GPT 모델 옵션
  openai:
    "GPT-5 Mini": "gpt-5-mini"
    "GPT-5.2": "gpt-5.2"
    "GPT-4o": "gpt-4o"
    "GPT-4o Mini": "gpt-4o-mini"
    "GPT-4 Turbo": "gpt-4-turbo"

# ------------------------------------------------------------
# 프롬프트 설정 (Prompt Configuration)
# ------------------------------------------------------------
prompts:
  # 기본 시스템 지시사항 (양쪽 AI에게 공통 적용)
  # {CURRENT_DATE}는 런타임에 실제 날짜로 치환됩니다
  system_instruction: |
    ## 기준 날짜
    오늘 날짜는 {CURRENT_DATE}입니다. 모든 정보의 유효성을 이 날짜 기준으로 판단하세요.

    ## 당신의 역할
    당신은 전문적이고 논리적인 AI 토론자입니다.
    상대방 AI와 1:1로 상호작용하며, 사용자의 질문에 대해 최적의 답변을 도출해야 합니다.
    단순히 역할을 분담하는 것이 아니라, 서로의 의견을 철저히 검증하고 개선하는 과정을 거쳐야 합니다.

    ## ⚠️ 첨부파일 취급 규칙 (중요!)
    사용자가 첨부한 파일(PDF, 이미지, 문서, 코드 등)은 **참고자료(Reference Material)**입니다.
    - 첨부파일 자체를 팩트체크 대상으로 삼지 마세요.
    - 첨부파일은 사용자의 질문에 답하기 위한 맥락 정보로 활용하세요.
    - 첨부파일 내의 주장이나 데이터를 사용자의 질문에 답하는 데 활용하되, 파일의 존재 자체를 검증하지 마세요.
    - 예: IR 문서가 첨부되면, 그 IR의 내용을 바탕으로 사용자 질문에 답하세요. IR 문서 자체가 맞는지 틀리는지를 논하지 마세요.

    ## 필수 검증 절차 (상대방 AI의 발언에 대해서만)
    **상대방 AI의 발언**에 대해서만 다음 검증을 수행하세요 (첨부파일이 아닌!):

    1. **시간적 검증 (Temporal Validation)**
       - 상대방이 제시한 정보가 {CURRENT_DATE} 기준에서도 유효한가?
       - 과거에는 사실이었지만 현재는 더 이상 유효하지 않은 정보는 아닌가?
       - 만약 상대방이 과거 정보를 현재 사실처럼 말하면 정정하세요.

    2. **논리적 검증 (Logical Validation)**
       - 상대방의 주장에 논리적 오류나 모순이 있는가?
       - 근거가 불충분하거나 누락된 정보가 있는가?

    3. **사실 검증 (Factual Validation)**
       - 상대방이 제시한 사실이 정확한가?
       - 인용한 데이터나 통계가 정확하고 최신({CURRENT_DATE} 기준)인가?

    ## 출력 모드

    ### 🔴 토론 모드 (상대방과 이견이 있는 경우)
    반드시 아래 형식을 사용하세요:

    ### [팩트체크 및 검증]
    - **상대방 주장 요약**: (상대방이 말한 핵심 내용)
    - **시의성 검증**: ({CURRENT_DATE} 기준 유효성)
    - **논리적 검증**: (논리적 오류 지적)
    - **사실 검증**: (잘못된 사실 정정)

    ※ 첫 발언이면 "(첫 발언입니다)"로 표시

    ### [나의 의견 및 개선안]
    (검증된 사실을 바탕으로 한 {CURRENT_DATE} 기준의 답변)

    ### [합의 여부]
    (계속 토론)

    ---

    ### 🟢 종료 모드 (상대방과 완전히 합의하는 경우)
    상대방의 의견이 완벽하고 실질적으로 추가하거나 수정할 내용이 없다면,
    **위의 형식을 모두 무시하고** 다음과 같이 간결하게 출력하세요:

    [AGREED]

    **최종 합의된 결론:**
    (사용자의 원래 질문에 대한 최종 답변을 1-3문단으로 명확하게 요약)

    ---

    ## 합의 규칙
    1. 상대방의 의견이 충분히 타당하고 실질적인 이견이 없으면 [AGREED]를 출력하세요.
    2. [AGREED]를 출력할 때는 **반드시** 사용자의 원래 질문에 대한 최종 답변을 함께 제시하세요.
    3. [AGREED] 출력 후에는 추가 질문이나 코멘트를 하지 마세요.
    4. 사소한 표현 차이나 스타일 차이는 무시하고 핵심 내용이 일치하면 합의하세요.
    5. 쓸데없이 토론을 길게 끌지 마세요. 핵심이 합의되면 즉시 종료하세요.

  # Gemini 전용 추가 지시사항
  gemini_additional: |
    당신은 Gemini AI입니다. GPT와 1:1로 토론하여 사용자에게 최선의 답변을 제공하세요.
    분석적이고 체계적인 관점에서 GPT의 의견을 검증하되, 사소한 차이점에 집착하지 마세요.
    핵심이 일치하면 빠르게 합의하고, [AGREED]와 함께 최종 결론을 제시하세요.

  # GPT 전용 추가 지시사항
  gpt_additional: |
    당신은 GPT AI입니다. Gemini와 1:1로 토론하여 사용자에게 최선의 답변을 제공하세요.
    실용적이고 구체적인 관점에서 Gemini의 의견을 검증하되, 사소한 차이점에 집착하지 마세요.
    핵심이 일치하면 빠르게 합의하고, [AGREED]와 함께 최종 결론을 제시하세요.

# ------------------------------------------------------------
# 파일 처리 설정 (File Processing)
# ------------------------------------------------------------
file_processing:
  # 텍스트 파일 최대 읽기 크기 (바이트)
  max_text_size: 1048576  # 1MB

  # 지원하는 파일 확장자 목록
  supported_extensions:
    text:
      - ".txt"
      - ".md"
      - ".py"
      - ".js"
      - ".ts"
      - ".java"
      - ".c"
      - ".cpp"
      - ".h"
      - ".css"
      - ".html"
      - ".xml"
      - ".json"
      - ".yaml"
      - ".yml"
      - ".csv"
      - ".log"
      - ".sql"
      - ".sh"
      - ".bat"
      - ".ps1"
    image:
      - ".jpg"
      - ".jpeg"
      - ".png"
      - ".gif"
      - ".webp"
      - ".bmp"
    document:
      - ".pdf"
      - ".docx"
      - ".xlsx"
      - ".pptx"
    media:
      - ".mp4"
      - ".mp3"
      - ".wav"
      - ".avi"
      - ".mov"
      - ".webm"

# ------------------------------------------------------------
# 사전 정의 질문 (Preset Questions)
# ------------------------------------------------------------
# 자주 사용하는 질문을 미리 정의해두면 번호 선택으로 빠르게 입력할 수 있습니다.
# 카테고리별로 질문을 분류하여 관리할 수 있습니다.
preset_questions:
  # 기술 관련 질문
  기술:
    - "최신 AI 기술 트렌드와 발전 방향에 대해 설명해주세요."
    - "클라우드 컴퓨팅과 온프레미스의 장단점을 비교해주세요."
    - "마이크로서비스 아키텍처 vs 모놀리식 아키텍처의 적합한 사용 사례는?"

  # 비즈니스 관련 질문
  비즈니스:
    - "아래 내용이 팩트인지 검증해줘. 실제로 존재하는 상품 내지는 정책인지, 우리회사가 수령가능한지. ### 1. [종합 판정표] 라덱셀 맞춤형 보증 상품 재진단 - 팔로업 스터디 필요함

    - | **구분** | **상품명** | **핵심 요건** | **현황 (Fact Check)** | **판정** |
    - | --- | --- | --- | --- | --- |
    - | **유니콘** | **기보 아기유니콘** | 업력 7년 이내
    - 적격투자 20억↑ | **업력 7.8년 (초과/탈락)**
    - 개인투자조합 (불인정) | **Dead** |
    - | **유니콘** | **기보 예비유니콘** | 적격투자 50억↑
    - 성장성 평가 | **개인투자조합 자금 제외 가능성**
    - (실적 미달) | **Dead** |
    - | **투자** | **기보 투자연계** | 적격 VC 투자 유치 | 개인투자조합 대상 제외 가능 | **Dead** |
    - | **투자** | **신보 투자브릿지** | 적격 투자기관 유치 | 상동 (기관 투자 아님) | **Dead** |
    - | **IP** | **기보 IP가치평가** | 등록 특허 보유
    - 가치 산출 가능성 | **등록 특허 25건 보유**
    - (투자자/등급 무관) | **Alive** |
    - | **R&D** | **기보 R&D사업화** | 정부 R&D 수행 | **국가과제 45억 수행**
    - (투자자/등급 무관) | **Alive** |
    - | **성장** | **신보 Best-Value** | 미래성장성 우수
    - (평가 등급 필요) | **T3 미보유**
    - (신청 시 평가 필) | **Cond. Alive** |

    ---

    - ### 2. 옵션별 상세 분석 및 실행 전략

    - ### ① [Dead] 아기유니콘 & 예비유니콘

    - **분석:** 정부 공인 '적격 투자기관(VC 등)' 실적 필수. 개인투자조합 자금은 시장 검증으로 불인정.
    - **현황:** 아기유니콘은 업력 초과, 예비유니콘은 투자 요건 미달.
    - **전략:** **포기 권장.** 자격 요건 미달로 시간 낭비임.

    - ### ② [Dead] 투자연계보증 (기보/신보)

    - **분석:** VC의 엄격한 심사를 통과했다는 전제로 지원하는 상품. 개인투자조합은 심사 공신력 부족으로 배제됨.
    - **전략:** 90억 원은 보증 한도 산정용(Leverage)이 아닌, **'재무 건전성(자본금)' 방어용**으로만 활용.

    - ### ③ [Alive & Best] IP 가치평가보증 (기보) - **최우선**

    - **분석:** 투자자 성격 무관. 오직 '기술(특허)의 현금창출 능력'만 평가함.
    - **강점:** 등록 특허 25건(평가 대상 충분), 국가과제 45억(TRL 입증).
    - **전략:** 기보 기술평가센터에 IP 가치평가 신청. 산출된 기술가치금액을 곧 보증 한도로 확보. 매출 0원 돌파의 유일한 대안임.

    - ### ④ [Alive] R&D 사업화 보증 (기보) - **차순위**

    - **분석:** 정부 R&D 과제 수행 기업 대상. T3 등급 없어도 과제 이력으로 신청 가능.
    - **전략:** 2025~2028년 진행 과제(20억) 등 총 45억 실적 근거로 **'양산 운전자금'** 신청.

    - ### ⑤ [Conditional Alive] 신보 Best-Value 보증

    - **분석:** 미래 성장성 평가. 신청 시 기술평가(KTRS) 필수.
    - **전략:** 현재 T3 미보유 상태이므로, **보증 신청과 동시에 기술평가 의뢰.** IP와 R&D 실적 방어하여 T3 이상 획득 시 승인 가능. 단, 매출 0원 방어를 위해 **'인허가 후 구매 확약(LOI)'** 필수.

    ---

    - ### 3. 최종 수정 전략 (Revised Strategy)

    - 전략의 축을 **[투자 스펙 중심]**에서 **[실물 자산/평가 중심]**으로 급선회함.

    - 1. **메인 타겟 변경:**
    - ~~유니콘, 투자연계~~ (배제)
    - **IP 가치평가(기보) & R&D 우대보증** (집중)
    - 2. **T3 등급 확보:**
    - 별도 획득 불필요. **'IP 가치평가보증' 신청 시 기보가 자체 기술평가 수행.** 이때 25건 특허와 45억 과제 실적 집중 어필하여 등급 및 가치평가액 동시 확보.

    - **결론: 화려한 간판(유니콘) 대신 [특허 25건]을 담보로 현금화하는 'IP 금융' 전략이 가장 현실적이고 유일한 돌파구임.** "
    - "다음 내용이 실제로 존재하는 상품들인지, 정확한 명칭이 맞는지, 현 시점에도 존재하는 것인지, 핵심 요건을 제대로 작성된게 맞는지 팩트체크 해줘. 구분	상품명	핵심 요건
    - 유니콘	기보 아기유니콘	업력 7년 이내
    - 적격투자 20억↑
    - 유니콘	기보 예비유니콘	적격투자 50억↑
    - 성장성 평가
    - 투자	기보 투자연계	적격 VC 투자 유치
    - 투자	신보 투자브릿지	적격 투자기관 유치
    - IP	기보 IP가치평가	등록 특허 보유
    - 가치 산출 가능성
    - R&D	기보 R&D사업화	정부 R&D 수행
    - 성장	신보 Best-Value	미래성장성 우수
    - (평가 등급 필요)"
    - "B2B vs B2C 비즈니스 모델의 핵심 차이점은?"

  # 분석 관련 질문
  분석:
    - "첨부된 문서의 핵심 내용을 요약해주세요."
    - "첨부된 데이터를 분석하고 인사이트를 도출해주세요."
    - "첨부된 코드의 문제점과 개선 방안을 제안해주세요."

  # 일반 질문
  일반:
    - "효과적인 의사결정을 위한 프레임워크를 제안해주세요."
    - "복잡한 문제를 체계적으로 분석하는 방법은?"

# ------------------------------------------------------------
# HTML 출력 설정 (HTML Output)
# ------------------------------------------------------------
html_output:
  # HTML 테마
  theme: "modern"  # modern, classic, dark

