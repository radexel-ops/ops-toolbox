# VibeOps Nginx Configuration
#
# Place this file in: /etc/nginx/sites-available/vibeops
# Enable with: ln -s /etc/nginx/sites-available/vibeops /etc/nginx/sites-enabled/

upstream vibeops_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;  # Replace with your domain

    # Logging
    access_log /var/log/nginx/vibeops_access.log;
    error_log /var/log/nginx/vibeops_error.log;

    # Max upload size
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API and WebSocket
    location / {
        proxy_pass http://vibeops_api;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (longer for AI responses)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering
        proxy_buffering off;
        proxy_cache off;
    }

    # Health check endpoint (for load balancers)
    location /health {
        proxy_pass http://vibeops_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static files (optional, if serving separately)
    # location /static/ {
    #     alias /home/vibeops/vibeops/rpa/RDXL_OPS/frontend/;
    #     expires 7d;
    #     add_header Cache-Control "public, immutable";
    # }
}

