_metadata:
  version: 2.1.0
  last_updated: '2026-01-09'
  description: 회계처리 실무지침서 - 자연어 기반 분류 알고리즘
company_profile:
  회계기준: 중소기업회계기준
  향후계획: IFRS 전환 고려
  결산월: 12월
  업종: 제조업/연구개발/의료기기
  자본화_기준금액: 1000000
  자본화_정책:
    유형자산_기준: 100만원 이상, 1년 이상 사용
    무형자산_기준: 100만원 이상, 장기 효익 있음
    개발비_인식조건: 5요건 모두 충족 시 자산화
    감가상각방법: 정액법
    내용연수:
      기계장치: 8년
      차량운반구: 5년
      비품: 5년
      구축물: 20년
      소프트웨어: 5년
      개발비: 5년
  회계방향:
    기본원칙: 웬만하면 자본화하되, 감사인/업계 관행 범위 안에서 적용
    불확실한경우: 비용처리 우선 (보수주의)
classification_categories:
  1_유형자산:
    설명: 물리적 형태가 있는 장기 자산
    계정과목:
    - 206 기계장치
    - 208 차량운반구
    - 211 구축물
    - 212 비품
  2_건설중인자산:
    설명: 아직 완성되지 않은 자산 (완료 시 유형자산으로 대체)
    계정과목:
    - 214 건설중인자산
  3_무형자산:
    설명: 물리적 형태 없이 권리나 가치가 있는 자산
    계정과목:
    - 231 영업권
    - 232 특허권
    - 233 상표권
    - 239 개발비
    - 240 소프트웨어
  4_기타:
    설명: 위 분류에 해당하지 않는 자산 또는 비용
    계정과목:
    - 140 선급금
    - 180 투자자산
    - 501 원재료
    - 823 경상연구개발비
    - 830 소모품비
    - 831 지급수수료
    - 960 임차보증금
master_decision_tree:
  STEP1_IP체크:
    질문: 이 거래가 지식재산권(IP)과 관련이 있는가?
    설명: '특허, 상표, 디자인 출원/등록/유지와 관련된 거래인지 확인합니다.

      특허관리번호가 있거나, 출원/등록/연차료 등의 표현이 있으면 IP 관련입니다.

      '
    YES일_때:
      취득목적: 214 건설중인자산 → 등록 완료 시 232 특허권 또는 233 상표권으로 대체
      유지비용: 832 세금과공과금 (연차료 등)
      결과: 분류 종료
    NO일_때: STEP2로 진행
  STEP2_환급성체크:
    질문: 이 거래가 돌려받을 권리가 있는 보증금이나 투자금인가?
    설명: '임차보증금, 예치금, 전세금 등 계약 종료 시 환급받는 금액인지 확인합니다.

      주식이나 출자금 납입도 여기서 확인합니다.

      '
    YES일_때:
      보증금류: 960 임차보증금 (기타비유동자산)
      투자금류: 180 투자자산
      결과: 분류 종료
    NO일_때: STEP3로 진행
  STEP3_금액효익체크:
    질문: 공급가 100만원 이상이거나, 금액과 무관하게 장기적인 효익이 있는가?
    설명: '자산으로 인식하려면 일정 금액 이상이거나 1년 이상 효익이 있어야 합니다.

      금액이 작아도 장기간 사용하는 것은 자산일 수 있습니다.

      '
    기준금액: 1000000
    YES일_때: STEP4로 진행 (자산화 후보)
    NO일_때: STEP6으로 진행 (비용/재고 처리)
  STEP4_물리적형태:
    질문: 이 거래의 대상이 물리적인 형태가 있는 것인가?
    설명: '장비, 기계, 부품, 차량, 시설물 등 눈에 보이고 만질 수 있는 것인지 확인합니다.

      소프트웨어, 용역, 권리 등은 물리적 형태가 없습니다.

      '
    YES일_때: STEP4A로 진행 (유형자산 검토)
    NO일_때: STEP4B로 진행 (무형자산/용역 검토)
  STEP4A_유형자산분류:
    설명: 물리적 자산의 세부 분류
    유형판단:
      질문: 이 자산은 어떤 용도로 사용되는가?
      선택지:
        생산실험장비: '공장이나 연구소에서 생산/실험에 사용하는 장비

          → 206 기계장치

          '
        사무IT장비: '사무실에서 사용하는 컴퓨터, 프린터, 에어컨 등

          → 212 비품

          '
        시설공사: '건물 내부 인테리어, 전기/배관 공사, 클린룸 등

          → 211 구축물 (진행 중이면 214 건설중인자산)

          '
        차량: '업무용 차량, 지게차 등 운반 수단

          → 208 차량운반구

          '
        개발용부품: '개발 중인 제품에 사용되는 부품

          → STEP4A-3으로 진행

          '
    인도설치상태:
      질문: 결산일 기준으로 자산이 인도되고 설치가 완료되었는가?
      YES일_때: 해당 유형자산 계정으로 분류
      NO일_때:
        계약만_체결: 140 선급금 유지
        제작공사_진행중: 214 건설중인자산
  STEP4A-3_개발용부품:
    설명: 개발 프로젝트에 사용되는 부품의 분류 (R&D팀 확인 필요)
    핵심질문:
      질문: 이 부품이 포함된 장치가 프로젝트 종료 후에도 1년 이상 다른 프로젝트에서 재사용될 계획인가?
      YES_재사용계획있음:
        설명: 테스트베드, 파일럿 장비, 영구 설비 성격
        세부질문: 관련 부품들을 하나의 기계장치로 묶어서 관리할 계획인가?
        묶어서관리: 214 건설중인자산 → 완성 시 206 기계장치로 대체
        개별관리: 100만원 이상이면 개별 유형자산
      NO_재사용없음:
        설명: 프로젝트 종료와 함께 폐기되거나 완제품에 흡수
        세부질문: 판매용 완제품 제작을 위한 재료/부품인가?
        완제품용_상업생산전: 823 경상연구개발비 또는 시제품 재고
        완제품용_상업생산후: 501 원재료
        일회성실험용: 823 경상연구개발비 또는 830 소모품비
  STEP4B_무형자산분류:
    설명: 물리적 형태가 없는 자산/용역의 분류
    개발비_검토:
      질문: 이 지출이 개발비 자산화 5요건을 모두 충족하는가?
      5요건:
      - 특정 프로젝트에 직접 귀속되는가?
      - 기술적 실현 가능성이 확보되었는가?
      - 상업화/인허가까지 가져갈 의도와 계획이 명확한가?
      - 필요한 인력/설비/자금이 확보되어 있는가?
      - 지출을 신뢰성 있게 측정 가능한가?
      모두_YES: 239 개발비 (무형자산)
      하나라도_NO: 다음 단계로
    소프트웨어_검토:
      질문: 영구적으로 사용할 수 있는 소프트웨어 라이선스 구매인가?
      설명: 구독형(SaaS, 월정액, 연간구독)은 해당 안됨
      영구라이선스: 240 소프트웨어
      구독형: 831 지급수수료
    기타권리_검토:
      질문: 영업권, 회원권, 권리금 등 특수한 권리인가?
      true: 231 영업권 또는 해당 무형자산 계정
      false: 다음 단계로
    용역수수료:
      설명: 일반적인 용역이나 서비스 비용
      법무세무자문: 831 지급수수료
      연구외주실험: 823 경상연구개발비 (개발비 요건 미충족 시)
      SaaS_클라우드: 831 지급수수료
  STEP6_비용재고:
    설명: 100만원 미만이거나 장기효익이 없는 경우
    분류기준:
      소모품_사무용품: 830 소모품비
      연구실험재료: 823 경상연구개발비
      일반용역: 831 지급수수료
contract_payment_check:
  설명: 선급금이나 계약금/중도금/잔금 표기가 있을 때 추가 확인
  인도완료여부:
    질문: 결산일 기준 자산이 인도/설치 완료되었는가?
    true: 해당 유형/무형자산 계정으로 대체
    false: 작업진행여부 확인
  작업진행여부:
    질문: 실제 제작/공사/개발이 진행 중인 증빙이 있는가?
    YES_물리적자산: 214 건설중인자산
    YES_개발용역: 239 개발비
    false: 선급금 유지 (환불 불가 시 손상 검토)
