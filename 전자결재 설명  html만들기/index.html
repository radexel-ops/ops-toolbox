    <style>
        :root {
            --color-blue: #2C5CA3; --color-green: #20B685; --color-text: #424242;
            --stage-title-height: 60px; --pad-desk-h: 24px; --fs-home: 22px;
        }
        html, body {
            margin: 0; height: 100%; font-family: 'Noto Sans KR', sans-serif;
            background: #fff; color: var(--color-text); overflow: hidden;
        }
        .stage-title {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            height: var(--stage-title-height); line-height: var(--stage-title-height);
            text-align: center; font-weight: 700; font-size: 2rem; color: var(--color-green); background: #fff;
        }
        .control-btn {
            position: fixed; padding: 16px 24px; font-size: var(--fs-home);
            border: none; border-radius: 8px; background: none; font-weight: 700;
            cursor: pointer; z-index: 1000;
        }
        #backBtn { bottom: 18px; left: 2px; color: var(--color-green); }
        #overviewBtn { bottom: calc(18px + 64px); left: 2px; color: var(--color-green); }
        #toggleGeneratorBtn { bottom: calc(18px + 128px); left: 2px; color: var(--color-blue); }

        /* --- 💡 분할 화면 + 리사이저 스타일 --- */
        #appContainer {
            display: flex;
            position: fixed;
            top: var(--stage-title-height);
            left: 0;
            width: 100%;
            height: calc(100% - var(--stage-title-height));
        }
        #guideContainer {
            flex: 1 1 100%;
            min-width: 300px;
            overflow-y: auto;
            transition: flex-basis 0.5s ease-in-out;
        }
        #resizer {
            flex: 0 0 10px;
            background-color: #e2e8f0;
            cursor: col-resize;
            display: none; /* 평소엔 숨김 */
        }
        #generatorContainer {
            flex: 0 0 0;
            min-width: 0;
            overflow: hidden;
            border-left: 1px solid #ccc;
            transition: flex-basis 0.5s ease-in-out;
        }
        #generatorFrame {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* 생성기가 활성화된 상태 */
        body.generator-visible #guideContainer { flex-basis: 67%; }
        body.generator-visible #generatorContainer { flex-basis: 33%; }
        body.generator-visible #resizer { display: block; }
        
        /* --- 가이드 스타일 --- */
        #stage { padding: var(--pad-desk-h); display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100%; box-sizing: border-box; }
        .option { font-weight: 700; font-size: clamp(1.5rem, 8vw, 2rem); text-align: center; cursor: pointer; user-select: none; margin-bottom: 24px; }
        .highlight { color: var(--color-green); }
        #finalPanel { display: none; flex-direction: column; padding: var(--pad-desk-h); }
        #finalPanel h1 { font-size: 2rem; color: var(--color-blue); text-align: center; }
        #finalPanel section { font-size: 1.2rem; }
        #finalPanel iframe { width: 100%; aspect-ratio: 16/9; border: 1px solid #ccc; border-radius: 8px; }

        /* --- 이미지 모달 스타일 --- */
        #imgModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.8); justify-content:center; align-items:center; z-index:5000; }
        .modal-content { position:relative; max-width:90vw; max-height:90vh; overflow:auto; }
        #closeModal { position:absolute; top:8px; right:8px; border:none; background:none; font-size:1.8rem; color:#fff; cursor:pointer; }
    </style>
</head>

    </script>

    <script type="module">
        // ------------------ 기존 결재 가이드 로직 ------------------
        const stagePrompts = [ '임직원인가요, 업무 담당자인가요?', '전자결재 카테고리를 선택해주세요', '세부항목을 선택해주세요 ', '지출하려는 비용의 범위는 어떻게 되나요?', '결재 수단은 무엇인가요?' ];
        const rows = d3.csvParse(document.getElementById('csvData').textContent.trim());
        const LV = Object.keys(rows[0]).filter(k=>/^분류\d+$/.test(k)).sort((a,b)=>+a.slice(2)-+b.slice(2));
        function upsert(p,l){ return p.children.find(c=>c.name===l)||(p.children.push({name:l,children:[]}),p.children.at(-1)); }
        function build(data){ const root = { name:'ROOT', children:[] }; data.forEach(r=>{ let n = root; LV.forEach(lv=>{ const v = (r[lv] || '').trim(); if (v) n = upsert(n, v); }); n.payload = { cat3 : (r['분류3'] || ''), cash : (r['분류4'] || ''), pay : (r['분류5'] || ''), big : (r['대분류'] || ''), desc : (r['프로세스 설명'] || '').replace(/•/g,'<br>•'), l1 : (r['신청 방법'] || '') }; }); return root; }
        const tree = build(rows);
        const stage = document.getElementById('stage');
        const titleEl = document.getElementById('stageTitle');
        const finalPanel = document.getElementById('finalPanel');
        const hist = [];
        const highlight = t => t.replace(/미만|이상|무관|금액무관/g, `<span class="highlight">$&</span>`);
        const scrollTopAll = () => { document.getElementById('guideContainer').scrollTop = 0; };
        function auto(node){ while(node.children?.length===1 && !node.children[0].payload){ hist.push(node); node=node.children[0]; } if(node.children?.length===1 && node.children[0].payload){ show(node.children[0].payload); return null; } return node; }
        function render (node) {
            node = auto(node); if (!node) return;
            titleEl.textContent = stagePrompts[hist.length] || '';
            stage.innerHTML = '';
            node.children.forEach(c => {
                const el = document.createElement('div'); el.className = 'option';
                el.innerHTML = highlight(c.name); el.tabIndex = 0;
                el.onclick = () => { hist.push(node); c.payload ? show(c.payload) : render(c); };
                stage.appendChild(el);
            });
        }
        function show(d){
            stage.style.display = 'none';
            finalPanel.style.display = 'flex';
            document.getElementById('fpTitle').innerHTML = d.cat3 || '';
            let html = `<p><b>승인권한 :</b> ${d.big || '-'}</p><p><b>금액범위 :</b> ${d.cash || '-'}</p><p><b>결제수단 :</b> ${d.pay || '-'}</p><hr><p>${d.desc}</p>`;
            if (d.l1) html += `<h3>신청 매뉴얼</h3><iframe src="${d.l1}" allowfullscreen></iframe>`;
            document.getElementById('fpBody').innerHTML = html;
            const homeBtnFP = document.createElement('button'); homeBtnFP.className = 'control-btn'; homeBtnFP.textContent = '뒤로'; homeBtnFP.style.position = 'static';
            homeBtnFP.onclick = () => { if(hist.length > 0) { render(hist.pop()); } else { resetApp(); } stage.style.display = 'flex'; finalPanel.style.display = 'none'; };
            finalPanel.appendChild(homeBtnFP);
            scrollTopAll();
        }
        function resetApp(){ stage.style.display = 'flex'; finalPanel.style.display = 'none'; hist.length=0; render(tree); scrollTopAll(); }
        document.getElementById('backBtn').onclick = resetApp;
        const modal = document.getElementById('imgModal');
        document.getElementById('overviewBtn').addEventListener('click', () => modal.style.display='flex');
        document.getElementById('closeModal').addEventListener('click', () => modal.style.display='none');
        render(tree);
        
        /* ---------- 💡 분할 화면 및 리사이저 로직 (신규) ---------- */
        const toggleBtn = document.getElementById('toggleGeneratorBtn');
        const body = document.body;
        const resizer = document.getElementById('resizer');
        const guideContainer = document.getElementById('guideContainer');
        const generatorContainer = document.getElementById('generatorContainer');
        let isGeneratorVisible = false;

        toggleBtn.addEventListener('click', () => {
            isGeneratorVisible = !isGeneratorVisible;
            body.classList.toggle('generator-visible');
            toggleBtn.textContent = isGeneratorVisible ? '가이드 숨기기' : '양식 작성';
        });

        let isResizing = false;
        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', () => {
                isResizing = false;
                document.removeEventListener('mousemove', handleMouseMove);
                body.style.userSelect = 'auto';
            });
            body.style.userSelect = 'none';
        });

        function handleMouseMove(e) {
            if (!isResizing) return;
            const totalWidth = window.innerWidth;
            const newGuideWidth = e.clientX;
            const newGeneratorWidth = totalWidth - newGuideWidth - resizer.offsetWidth;
            
            if (newGuideWidth > 300 && newGeneratorWidth > 300) { // 최소 너비 보장
                guideContainer.style.flexBasis = `${newGuideWidth}px`;
                generatorContainer.style.flexBasis = `${newGeneratorWidth}px`;
            }
        }
    </script>
